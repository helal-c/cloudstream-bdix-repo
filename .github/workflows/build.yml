name: Build Plugins & Generate Repo

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # এই পারমিশনটি builds ব্রাঞ্চে ফাইল পুশ করতে সাহায্য করবে
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5' # ম্যানুয়াল ফাইল তৈরির জন্য এটি জরুরি

      - name: Build Plugins and Generate repo.json
        run: gradle make

      - name: Deploy to Builds Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: build
          clean: true
          
