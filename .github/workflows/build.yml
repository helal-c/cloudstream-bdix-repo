name: Build Plugins & Generate Repo

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Plugins and Generate repo.json
        run: gradle make

      - name: Check Build Output
        run: |
          echo "===== BUILD DIRECTORY ====="
          ls -la build || true

          echo "===== BUILD FILES ====="
          find build -maxdepth 3 -type f -print || true

      - name: Deploy to Builds Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: build
          clean: true