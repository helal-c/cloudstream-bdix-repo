name: Build CloudStream Plugins

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Plugins
        run: |
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew make
          ./gradlew makePluginsJson

      - name: Show Build Output
        run: |
          echo "===== BUILD ====="
          find . -type f \
            \( -name "*.cs3" -o -name "plugins.json" \) \
            -print

      - name: Prepare Repository
        run: |

          rm -rf deploy

          mkdir -p deploy

          cp repo.json deploy/repo.json

          find . -type f \
            -name "*.cs3" \
            -exec cp {} deploy/ \;

          find . -type f \
            -name "plugins.json" \
            -exec cp {} deploy/plugins.json \;

          echo "===== DEPLOY ====="

          ls -lah deploy

      - name: Deploy Builds Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: deploy
          clean: true
          single-commit: true
